name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::SSH attempt ${attempt}"
            if timeout 600 ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
                -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
                -i ~/.ssh/deploy_key \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "/storage/www/app/docker/scripts/deploy.sh '${{ github.sha }}'"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt ${attempt} failed or timed out, retrying in 15s..."
            sleep 15
          done
          echo "All SSH attempts failed"
          exit 1

      - name: External smoke test
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "http://${{ secrets.DEPLOY_HOST }}/up" > /dev/null; then
              exit 0
            fi
            echo "Smoke test attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "All smoke test attempts failed"
          exit 1
