[www]
; Tuned for the actual VPS size (889Mi RAM total, MySQL now off-box) —
; pm.max_children * php.prod.ini's memory_limit (256M) must stay well under
; that alongside nginx/OS/opcache, or the box starts swapping under
; concurrent requests. 3 * 256M = 768M worst case, leaving headroom.
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
