# svoyhod.ru is the only host the site is served on. Every other name that
# reaches this box (www, the old 194-87-221-164.sslip.io address, the bare
# IP) gets a 301 so search engines index a single copy of the site.
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://svoyhod.ru$request_uri;
    }
}

# The certificate lineage is still named after the sslip.io address, but it
# covers svoyhod.ru and www.svoyhod.ru too — keeping sslip.io on it lets old
# https links redirect without a certificate warning.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/194-87-221-164.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/194-87-221-164.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://svoyhod.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name svoyhod.ru;
    root /var/www/html/public;

    index index.php;

    ssl_certificate /etc/letsencrypt/live/194-87-221-164.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/194-87-221-164.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # /index.php and /index.php/<path> would otherwise serve duplicates of every page.
    if ($request_uri ~* "^/index\.php/?(.*)$") {
        return 301 https://svoyhod.ru/$1;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|ico|svg|woff|woff2|ttf)$ {
        # Fall through to Laravel for route-served assets (e.g. Livewire's
        # /livewire-<hash>/livewire.min.js) instead of a hard 404.
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
