name: shop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    networks:
      - internal
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *default-logging
    # No `command`/`ports` — invoked on demand via
    # `docker compose run --rm certbot <certbot args>` for both the initial
    # issuance and renewal (docker/scripts/renew-cert.sh).
    entrypoint: /bin/sh
    command: ["-c", "trap exit TERM; while :; do sleep 6h; done"]

networks:
  internal:

volumes:
  app-storage:
  app-public:
  certbot-conf:
  certbot-webroot:
