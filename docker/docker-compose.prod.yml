name: shop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: mysql
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - internal
    depends_on:
      - mysql
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      - app
    logging: *default-logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop}
      MYSQL_USER: ${DB_USERNAME:-shop}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    logging: *default-logging

networks:
  internal:

volumes:
  mysql-data:
  app-storage:
