name: shop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *default-logging
    # No `command`/`ports` — invoked on demand via
    # `docker compose run --rm certbot <certbot args>` for both the initial
    # issuance and renewal (docker/scripts/renew-cert.sh).
    entrypoint: /bin/sh
    command: ["-c", "trap exit TERM; while :; do sleep 6h; done"]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop}
      MYSQL_USER: ${DB_USERNAME:-shop}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

networks:
  internal:

volumes:
  mysql-data:
  app-storage:
  app-public:
  certbot-conf:
  certbot-webroot:
